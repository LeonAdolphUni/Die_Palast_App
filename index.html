<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Palast App</title>
    <meta name="description" content="Die Palast App – Putzplan & Einkaufsliste">
    <link rel="stylesheet" href="style.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">

        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="login-container">
                <div class="glass-card login-card">
                    <h1 class="login-title">Die Palast App</h1>
                    <p class="login-subtitle">Melde dich an, um fortzufahren.</p>
                    <div class="user-grid" id="user-grid"></div>

                    <div id="password-section" style="display: none; margin-top: 2rem;">
                        <p id="password-prompt" class="password-label"></p>
                        <input type="password" id="password-input" class="input" placeholder="Passwort">
                        <button id="login-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1rem;">Anmelden</button>
                        <button id="login-back-btn" class="btn-link" style="margin-top: 1rem;">Zurück</button>
                        <p id="login-error" class="error-text"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Menu View -->
        <div id="menu-view" class="view">
            <nav class="navbar glass-nav">
                <span class="navbar-title">Die Palast App</span>
                <div class="navbar-right">
                    <span id="menu-user-name" class="navbar-user"></span>
                    <button id="menu-logout-btn" class="btn-icon">🚪</button>
                </div>
            </nav>
            <main class="page">
                <div class="page-header">
                    <h1 class="page-hero-title">Was geht, Yalla?</h1>
                </div>
                <div class="menu-grid">
                    <button class="menu-card glass-card" id="menu-putzplan-btn">
                        <div class="menu-card-dot" style="background: var(--primary);">🧹</div>
                        <h2 class="menu-card-title">Putzplan</h2>
                        <p class="menu-card-desc">Check deine Aufgaben für diese Woche.</p>
                    </button>
                    <button class="menu-card glass-card" id="menu-shopping-btn">
                        <div class="menu-card-dot" style="background: var(--success);">🛒</div>
                        <h2 class="menu-card-title">Einkauf</h2>
                        <p class="menu-card-desc">Was fehlt noch im Kühlschrank?</p>
                    </button>
                    <button class="menu-card glass-card" id="menu-finance-btn">
                        <div class="menu-card-dot" style="background: var(--warning);">💸</div>
                        <h2 class="menu-card-title">Finanzen</h2>
                        <p class="menu-card-desc">Ausgaben fair in der WG teilen.</p>
                    </button>
                    <button class="menu-card glass-card" id="menu-profile-btn">
                        <div class="menu-card-dot" style="background: #bf5af2;">👤</div>
                        <h2 class="menu-card-title">Profil</h2>
                        <p class="menu-card-desc">PayPal & Einstellungen verwalten.</p>
                    </button>
                </div>
            </main>
        </div>

        <!-- Putzplan View -->
        <div id="putzplan-view" class="view">
            <nav class="navbar glass-nav">
                <button id="putzplan-back-btn" class="btn-icon">◀</button>
                <span class="navbar-title">Putzplan</span>
                <div class="navbar-right">
                    <button id="putzplan-logout-btn" class="btn-icon">🚪</button>
                </div>
            </nav>
            <main class="page">
                <div class="view-toggle glass-card">
                    <button id="view-week-btn" class="view-toggle-btn active">Woche</button>
                    <button id="view-month-btn" class="view-toggle-btn">Monat</button>
                </div>

                <header class="week-header">
                    <button id="prev-week-btn" class="btn-icon">◀</button>
                    <div class="week-info">
                        <h2 id="current-week-title">Diese Woche</h2>
                        <p id="current-week-date" class="subtitle"></p>
                    </div>
                    <button id="next-week-btn" class="btn-icon">▶</button>
                </header>

                <div id="putzplan-week-view">
                    <div class="my-task glass-card highlight-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3 style="margin: 0;">Deine Aufgabe</h3>
                            <label class="checkbox-container">
                                <input type="checkbox" id="task-done-checkbox">
                                <span class="checkmark"></span>
                                Erledigt
                            </label>
                        </div>
                        <div class="task-content">
                            <div class="task-icon" id="my-task-icon">🧹</div>
                            <div class="task-details">
                                <h4 id="my-task-title">Lade...</h4>
                                <p id="my-task-desc"></p>
                            </div>
                        </div>
                    </div>

                    <h3 class="section-title">Alle Aufgaben</h3>
                    <div class="all-tasks-grid" id="all-tasks-grid"></div>
                </div>

                <div id="putzplan-calendar-view" style="display: none;">
                    <div class="calendar-grid-header">
                        <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
                    </div>
                    <div id="calendar-grid" class="calendar-grid"></div>
                </div>
            </main>
        </div>

        <!-- Shopping View -->
        <div id="shopping-view" class="view">
            <nav class="navbar glass-nav">
                <button id="shopping-back-btn" class="btn-icon">◀</button>
                <span class="navbar-title">Einkauf</span>
                <div class="navbar-right">
                    <button id="shopping-logout-btn" class="btn-icon">🚪</button>
                </div>
            </nav>
            <main class="page">
                <div class="input-group">
                    <input type="text" id="shopping-input" class="input" placeholder="Produkt hinzufügen...">
                    <button id="shopping-add-btn" class="btn btn-primary">Hinzufügen</button>
                </div>
                <div id="shopping-list" class="shopping-list"></div>
                <p id="shopping-empty" class="empty-state" style="display: none;">Liste ist leer.</p>
            </main>
        </div>

        <!-- Finance View -->
        <div id="finance-view" class="view">
            <nav class="navbar glass-nav">
                <button id="finance-back-btn" class="btn-icon">◀</button>
                <span class="navbar-title">Finanzen</span>
                <div class="navbar-right">
                    <button id="finance-logout-btn" class="btn-icon">🚪</button>
                </div>
            </nav>
            <main class="page">
                <div class="finance-card glass-card">
                    <p class="subtitle">Gesamtbilanz</p>
                    <h2 id="finance-total-balance" class="balance-amount">0.00 €</h2>
                </div>
                
                <button id="finance-add-btn" class="btn btn-primary btn-full" style="margin: 1.5rem 0;">Neue Ausgabe</button>

                <h3 class="section-title">Schulden begleichen</h3>
                <div id="finance-debts-list" class="finance-list"></div>

                <h3 class="section-title" style="margin-top: 2rem;">Letzte Ausgaben</h3>
                <div id="finance-expenses-list" class="finance-list"></div>
            </main>
        </div>

        <!-- Modals -->
        <div id="modal-overlay" class="modal-overlay">
            
            <!-- Expense Modal -->
            <div id="expense-modal" class="modal glass-card">
                <div class="modal-header">
                    <h3 id="expense-modal-title">Neue Ausgabe</h3>
                    <button class="modal-close" id="expense-close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editing-expense-id">
                    <label class="input-label">Wofür?</label>
                    <input type="text" id="expense-desc" class="input" placeholder="z.B. Klopapier">
                    
                    <label class="input-label">Betrag (€)</label>
                    <input type="number" id="expense-amount" class="input" placeholder="0.00" step="0.01">
                    
                    <label class="input-label">Wer hat bezahlt?</label>
                    <select id="expense-payer" class="input"></select>
                    
                    <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                        <label class="input-label" style="margin: 0;">Aufteilung</label>
                        <select id="expense-split-type" class="input" style="width: auto;">
                            <option value="equal">Gleichmäßig</option>
                            <option value="custom">Individuell</option>
                        </select>
                    </div>
                    
                    <div id="expense-split-list" class="expense-split-list"></div>
                    
                    <button id="expense-save-btn" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">Speichern</button>
                </div>
            </div>

            <!-- Profile Modal -->
            <div id="profile-modal" class="modal glass-card">
                <div class="modal-header">
                    <h3>Dein Profil</h3>
                    <button class="modal-close" id="profile-close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <label class="input-label">PayPal.me Name</label>
                    <input type="text" id="profile-paypal-input" class="input" placeholder="dein_name">
                    <button id="profile-save-btn" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">Speichern</button>
                    <p id="profile-feedback" class="feedback-text"></p>
                </div>
            </div>

        </div>

    </div>

    <script src="data.js"></script>
    <script src="app.js?v=10"></script>
</body>

</html>
